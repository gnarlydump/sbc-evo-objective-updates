name: One-time replacement of three Objective updates
run-name: Replace three approved Objective updates — 2026-10-16

on:
  push:
    branches: [main]
    paths: [.github/workflows/objective-repost-test.yml]

permissions:
  contents: read

concurrency:
  group: futgg-bot-check
  cancel-in-progress: false

jobs:
  replace:
    if: ${{ github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Run approved three-objective replacement test 2026-10-16' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing bot dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Replace exactly the approved three Objective messages
        env:
          OBJECTIVES_WEBHOOK_URL: ${{ secrets.OBJECTIVES_WEBHOOK_URL }}
          APPROVED_EVENT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python temporary_objective_repost.py
