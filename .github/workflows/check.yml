name: Check fut.gg for new evolutions and SBCs

on:
  schedule:
    # Runs at the top of every hour, all day, as a general safety net
    # (GitHub may delay this by a few minutes during busy periods -- that's
    # normal for scheduled Actions). The precise 10:00/10:05 AM MST daily
    # checks are handled externally by cron-job.org calling the
    # workflow_dispatch API below, NOT by additional cron lines here --
    # GitHub's own scheduled triggers proved unreliable for that (delayed
    # by up to an hour, and newly-added cron lines sometimes never fired at
    # all). Keeping only the hourly entry here also avoids this schedule
    # colliding with the external 17:00/17:05 UTC triggers and launching
    # two overlapping runs at once (see `concurrency` below for the actual
    # duplicate-post protection either way).
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_expiry_repost:
        description: "Force a fresh repost of all currently-expiring evolutions (ignores what's already been notified)"
        type: boolean
        default: false

# If a run is somehow still in progress when the next trigger fires
# (e.g. the hourly schedule and an external cron-job.org trigger landing
# close together), queue the new run instead of starting it in parallel.
# Two runs executing at once would both read the same "seen" state before
# either had a chance to save it, and both would post the same "new" items
# -- this is what caused duplicate Discord posts. Queuing (not canceling)
# must be paired with the explicit live-main checkout below: the event SHA
# can predate the previous run's state commit, even after waiting in line.
concurrency:
  group: futgg-bot-check
  cancel-in-progress: false

permissions:
  contents: write  # needed so the workflow can commit the updated state file

jobs:
  check:
    # This workflow posts to production channels and persists one main ledger.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        id: checkout
        uses: actions/checkout@v4
        with:
          # Resolve main when the job starts, not the SHA when it was queued.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run bot
        env:
          EVOLUTIONS_WEBHOOK_URL: ${{ secrets.EVOLUTIONS_WEBHOOK_URL }}
          SBC_WEBHOOK_URL: ${{ secrets.SBC_WEBHOOK_URL }}
          OBJECTIVES_WEBHOOK_URL: ${{ secrets.OBJECTIVES_WEBHOOK_URL }}
          EXPIRING_EVOLUTIONS_WEBHOOK_URL: ${{ secrets.EXPIRING_EVOLUTIONS_WEBHOOK_URL }}
          EVOLUTIONS_ROLE_ID: ${{ secrets.EVOLUTIONS_ROLE_ID }}
          SBC_ROLE_ID: ${{ secrets.SBC_ROLE_ID }}
          OBJECTIVES_ROLE_ID: ${{ secrets.OBJECTIVES_ROLE_ID }}
          EXPIRING_ROLE_ID: ${{ secrets.EXPIRING_ROLE_ID }}
          FORCE_EXPIRY_REPOST: ${{ inputs.force_expiry_repost }}
        run: python bot.py

      # always(): if the bot dies partway through a run, the state it
      # already wrote still has to be committed. Without this the step is
      # skipped on failure, the seen-ids and the backfill marker are lost,
      # and the next run reposts what already went out.
      - name: Commit updated state
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          git config user.name "futgg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then
            echo "No state changes to save."
            exit 0
          fi
          state_base=$(git rev-parse HEAD)
          git commit -m "Update seen evolutions/SBCs state"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            # A push can succeed remotely even if its response is lost.
            if git merge-base --is-ancestor HEAD origin/main; then
              exit 0
            fi
            # Only rebase over unrelated edits. Never overwrite another
            # writer's ledger, force-push, or rerun the bot to retry a save.
            if ! git merge-base --is-ancestor "$state_base" origin/main ||
               ! git diff --quiet "$state_base" origin/main -- state/state.json; then
              echo "::error::Remote state changed during this run; refusing to overwrite it."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Could not safely rebase the saved state."
              exit 1
            fi
            sleep 5
          done
          echo "::error::State push failed after three attempts."
          exit 1
