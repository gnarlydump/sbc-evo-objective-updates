name: One-time Season 1 SP Chase replacement and footer cleanup
run-name: Replace Season 1 SP Chase and remove three post footers — 2026-10-16

on:
  push:
    branches: [main]
    paths: [.github/workflows/season-sp-cleanup.yml]

permissions:
  contents: read

concurrency:
  group: futgg-bot-check
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ github.ref == 'refs/heads/main' && (github.event.head_commit.message == 'Run approved Season 1 SP Chase replacement and clean post footers 2026-10-16' || github.event.head_commit.message == 'Inspect approved Season 1 SP Chase and objective message ownership 2026-10-16') && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing bot dependencies
        run: pip install -r requirements.txt
      - name: Install browser only for the authorized replacement
        if: ${{ github.event.head_commit.message == 'Run approved Season 1 SP Chase replacement and clean post footers 2026-10-16' }}
        run: playwright install --with-deps chromium
      - name: Inspect only the webhook and four approved message identities
        if: ${{ github.event.head_commit.message == 'Inspect approved Season 1 SP Chase and objective message ownership 2026-10-16' }}
        env:
          OBJECTIVES_WEBHOOK_URL: ${{ secrets.OBJECTIVES_WEBHOOK_URL }}
          APPROVED_EVENT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python temporary_season_sp_cleanup.py --inspect
      - name: Replace Season post and remove only the three approved footers
        if: ${{ github.event.head_commit.message == 'Run approved Season 1 SP Chase replacement and clean post footers 2026-10-16' }}
        env:
          OBJECTIVES_WEBHOOK_URL: ${{ secrets.OBJECTIVES_WEBHOOK_URL }}
          APPROVED_EVENT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python temporary_season_sp_cleanup.py
